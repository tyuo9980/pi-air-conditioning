<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AC</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<main>
  <div class="card">
    <div class="label">Current temperature</div>
    <div class="reading"><span id="temp">--</span><span class="unit">&deg;C</span></div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label label-inline">Set to</span>
      <span class="target"><span id="targetLabel">--</span>&deg;C</span>
    </div>
    <input type="range" id="slider" min="16" max="30" step="0.5" value="22" disabled>
    <div class="scale"><span>16&deg;</span><span>30&deg;</span></div>
  </div>

  <div class="card">
    <div class="label">Setting</div>
    <div class="segmented" id="setting" role="group" aria-label="Setting">
      <button type="button" data-setting="COOL" aria-pressed="false" disabled>Cool</button>
      <button type="button" data-setting="HEAT" aria-pressed="false" disabled>Heat</button>
    </div>
    <div class="label label-mode">Mode</div>
    <div class="segmented" id="mode" role="group" aria-label="Mode">
      <button type="button" data-mode="OFF" aria-pressed="false" disabled>Off</button>
      <button type="button" data-mode="CONSTANT" aria-pressed="false" disabled>Constant</button>
      <button type="button" data-mode="CYCLE" aria-pressed="false" disabled>Cycle</button>
      <button type="button" data-mode="AUTO" aria-pressed="false" disabled>Auto</button>
    </div>
    <div class="status" id="modeStatus"></div>
  </div>

  <div class="card" id="cycleCard" hidden>
    <div class="row">
      <label class="label label-inline" for="cycleOnMinutes">On for</label>
      <select id="cycleOnMinutes" class="minutes" disabled>
        <option value="1">1 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="60">60 min</option>
        <option value="90">90 min</option>
        <option value="120">120 min</option>
      </select>
    </div>
    <div class="row row-last">
      <label class="label label-inline" for="cycleOffMinutes">Off for</label>
      <select id="cycleOffMinutes" class="minutes" disabled>
        <option value="1">1 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="60">60 min</option>
        <option value="90">90 min</option>
        <option value="120">120 min</option>
      </select>
    </div>
    <button type="button" id="cycleNow" class="cycle-now" disabled>Cycle now</button>
  </div>

  <div class="status" id="status">Connecting&hellip;</div>
</main>
</body>
</html>
