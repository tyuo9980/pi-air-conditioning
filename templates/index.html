<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AC</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<main>
  <div class="card">
    <div class="label">Current temperature</div>
    <div class="reading"><span id="temp">--</span><span class="unit">&deg;C</span></div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label label-inline">Set to</span>
      <span class="target"><span id="targetLabel">--</span>&deg;C</span>
    </div>
    <input type="range" id="slider" min="16" max="30" step="0.5" value="22" disabled>
    <div class="scale"><span id="scaleMin">16&deg;</span><span id="scaleMax">30&deg;</span></div>
  </div>

  <button id="power" aria-pressed="false" disabled>Off</button>
  <div class="status" id="status">Connecting&hellip;</div>
</main>
</body>
</html>
